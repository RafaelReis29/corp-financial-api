spring.application.name=corp-financial-api
corp-financial-api.version=@project.version@
corp-financial-api.admin-key=${CORP_API_ADMIN_KEY:}
corp-financial-api.requests-per-minute=${CORP_API_REQUESTS_PER_MINUTE:120}
spring.mvc.apiversion.default=2.0.0
spring.mvc.apiversion.supported=1.0.0,1.0.1,2.0.0
spring.mvc.apiversion.detect-supported=false
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntax-highlight.theme=tomorrow-night
